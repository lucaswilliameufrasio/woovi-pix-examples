services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: click_collect
      POSTGRES_PASSWORD: ${CLICK_COLLECT_DB_PASSWORD:?Set CLICK_COLLECT_DB_PASSWORD to a generated local-only value}
      POSTGRES_DB: click_collect
    ports:
      - "127.0.0.1:${CLICK_COLLECT_DB_PORT:-55441}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U click_collect -d click_collect"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - click-collect-postgres-data:/var/lib/postgresql

volumes:
  click-collect-postgres-data:
