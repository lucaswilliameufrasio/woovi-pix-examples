services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: offers
      POSTGRES_PASSWORD: offers-local-only
      POSTGRES_DB: offers
    ports:
      - "127.0.0.1:55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offers -d offers"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - offers-postgres-data:/var/lib/postgresql

volumes:
  offers-postgres-data:
