services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: ${RESERVAS_DB_PASSWORD:?Set RESERVAS_DB_PASSWORD to a generated local-only value}
      POSTGRES_DB: reservations
    ports:
      - "127.0.0.1:${RESERVAS_DB_PORT:-55443}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations -d reservations"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - reservas-postgres-data:/var/lib/postgresql

volumes:
  reservas-postgres-data:
